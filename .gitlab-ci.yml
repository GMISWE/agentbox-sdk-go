workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - lint
  - test
  - build
  - verify

default:
  image: golang:1.25
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build
      - .cache/go-mod
  before_script:
    - go version

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod/pkg/mod"

fmt:
  stage: lint
  script:
    - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

vet:
  stage: lint
  script:
    - go vet ./...

lint:
  stage: lint
  image: golangci/golangci-lint:v1.64-alpine
  script:
    - golangci-lint run ./...

test:
  stage: test
  parallel:
    matrix:
      - GO_VERSION: ["1.23", "1.24", "1.25"]
  image: golang:${GO_VERSION}
  script:
    - go test -race -count=1 ./...

build:
  stage: build
  needs: []
  script:
    - go build ./...
    - go build ./examples/...

verify_tag:
  stage: verify
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - |
      case "$CI_COMMIT_TAG" in
        v[0-9]*.[0-9]*.[0-9]*) ;;
        *)
          echo "Tag $CI_COMMIT_TAG must be a semver tag prefixed with v (e.g. v0.1.0)"
          exit 1
          ;;
      esac
    - go build ./...
    - go vet ./...
    - go test -count=1 ./...
    - echo "Go modules are resolved directly from VCS tags; no separate publish step is required."
